name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          set -euo pipefail
          mkdir -p _site/lib _site/data
          cp index.html index.js about.html favicon.svg LICENSE README.md _site/
          cp lib/fires.js _site/lib/
          touch _site/.nojekyll
          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M')"
          BUILD_ISO="$(date -u '+%Y-%m-%dT%H:%M:00Z')"
          sed -i "s|__BUILD_ISO__|${BUILD_ISO}|g; s|__BUILD_TIME__|${BUILD_TIME}|g" _site/index.html
          grep -q "${BUILD_TIME}" _site/index.html
          grep -q "${BUILD_ISO}" _site/index.html
          # Same-origin fallbacks when browsers/content blockers block *.workers.dev
          curl -fsSL --max-time 45 -A 'FuegosVivos-PagesBuild' \
            "https://fuegos-proxy.crew.workers.dev/fires" -o _site/data/fires.json \
            || curl -fsSL --max-time 45 -A 'FuegosVivos-PagesBuild' \
              "https://api-lb.fogos.pt/new/fires" -o _site/data/fires.json
          curl -fsSL --max-time 90 -A 'FuegosVivos-PagesBuild' \
            "https://fuegos-proxy.crew.workers.dev/firms" -o _site/data/firms.geojson \
            || echo '{"type":"FeatureCollection","features":[]}' > _site/data/firms.geojson
          curl -fsSL --max-time 45 -A 'FuegosVivos-PagesBuild' \
            "https://fuegos-proxy.crew.workers.dev/bombers" -o _site/data/bombers.geojson \
            || echo '{"type":"FeatureCollection","features":[]}' > _site/data/bombers.geojson
          curl -fsSL --max-time 45 -A 'FuegosVivos-PagesBuild' \
            "https://fuegos-proxy.crew.workers.dev/infoca" -o _site/data/infoca.geojson \
            || echo '{"type":"FeatureCollection","features":[]}' > _site/data/infoca.geojson
          python3 - <<'PY'
          import json
          fires=json.load(open("_site/data/fires.json"))
          firms=json.load(open("_site/data/firms.geojson"))
          assert "data" in fires or isinstance(fires, list), fires
          assert firms.get("type")=="FeatureCollection", firms
          for name in ("bombers","infoca"):
            g=json.load(open(f"_site/data/{name}.geojson"))
            assert g.get("type")=="FeatureCollection", name
            print(f"fallback {name}", len(g.get("features", [])))
          print("fallback fires rows", len(fires.get("data", fires if isinstance(fires,list) else [])))
          print("fallback firms", len(firms.get("features", [])))
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
