name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          set -euo pipefail
          mkdir -p _site/lib
          cp index.html index.js about.html favicon.svg LICENSE README.md _site/
          cp lib/fires.js _site/lib/
          touch _site/.nojekyll
          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M')"
          BUILD_ISO="$(date -u '+%Y-%m-%dT%H:%M:00Z')"
          sed -i "s|__BUILD_ISO__|${BUILD_ISO}|g; s|__BUILD_TIME__|${BUILD_TIME}|g" _site/index.html
          grep -q "${BUILD_TIME}" _site/index.html
          grep -q "${BUILD_ISO}" _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
